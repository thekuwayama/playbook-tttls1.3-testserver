- name: Install snapd
  ansible.builtin.apt:
    name: snapd

- name: Install core snap
  community.general.snap:
    name: core
    state: present

- name: Install certbot snap
  community.general.snap:
    name: certbot
    classic: true
    state: present

- name: Symlink certbot snap into PATH
  ansible.builtin.file:
    src: /snap/bin/certbot
    dest: /usr/bin/certbot
    state: link

- name: Check existence of a certificate
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ domain }}/fullchain.pem"
  register: fullchain

- name: Check existence of a private-key
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ domain }}/privkey.pem"
  register: privkey

- name: Issue a certificate with ACME
  ansible.builtin.command:
    cmd: bash -lc "certbot certonly
      --standalone
      --key-type ecdsa
      --elliptic-curve secp256r1
      --preferred-profile shortlived
      --domain {{ domain }}
      --domain www.{{ domain }}
      --email {{ certbot_email }}
      --agree-tos
      --no-eff-email
      --pre-hook 'systemctl stop tttls1.3_https || true'"
  when: not (fullchain.stat.exists and privkey.stat.exists)

- name: Renew a certificate
  ansible.builtin.command:
    cmd: bash -lc 'certbot renew
      --pre-hook "systemctl stop tttls1.3_https || true"
      --key-type ecdsa
      --elliptic-curve secp256r1
      --preferred-profile shortlived
      --max-log-backups 10'
  when: fullchain.stat.exists and privkey.stat.exists

# certbot renews at 1/3 or 1/2 of remaining lifetime for certs shorter than 10 days,
# so a 3-day interval keeps renewals well within that window for the ~6-day "shortlived" profile:
# https://www.eff.org/deeplinks/2025/04/certbot-40-long-live-short-lived-certs
- name: Set crontab of certbot
  ansible.builtin.cron:
    name: 'certbot renew'
    day: '*/3'
    hour: '2'
    minute: '0'
    job: '/usr/bin/certbot renew
      --pre-hook "/usr/bin/systemctl stop tttls1.3_https"
      --post-hook "/usr/bin/systemctl start tttls1.3_https"
      --key-type ecdsa
      --elliptic-curve secp256r1
      --preferred-profile shortlived
      --max-log-backups 10'
    cron_file: certbot_renew
    user: root
