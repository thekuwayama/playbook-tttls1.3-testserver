- name: Install gems
  ansible.builtin.shell:
    bash -lc "{{ biryani_rbenv_directory }}/shims/gem list --installed --version {{ item.version }} {{ item.name }} ||
    {{ biryani_rbenv_directory }}/shims/gem install --norc --version {{ item.version }} --no-user-install --no-document {{ item.name }}"
  with_items:
    - "{{ biryani_gems }}"
  changed_when: false
